<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — SmartMart</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="brand"><div class="mark"></div> SmartMart</a>
  <div class="nav-links">
    <a href="index.html#how">How it works</a>
    <a href="index.html#features">Features</a>
    <a href="about.html">About</a>
  </div>
  <div class="nav-actions">
    <a href="login.html" class="btn btn-ghost">Log in</a>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="rs">SMARTMART · NEW ACCOUNT</div>
    <h1>Set up your store</h1>
    <p class="sub">Takes under a minute. No card required.</p>
    <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
      <div class="field">
        <label>SHOP NAME</label>
        <input type="text" placeholder="Rahul Supermart" required>
      </div>
      <div class="field">
        <label>EMAIL</label>
        <input type="email" placeholder="shopowner@example.com" required>
      </div>
      <div class="field">
        <label>PASSWORD</label>
        <input type="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-fill" style="width:100%; padding:12px; margin-top:6px;">Create account</button>
    </form>
    <p class="auth-foot">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>

</body>
</html>
